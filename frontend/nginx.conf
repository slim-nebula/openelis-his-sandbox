server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Static test client only. API calls are made to /api on the edge proxy,
    # which owns the route to Kong — the frontend never learns a service address.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
