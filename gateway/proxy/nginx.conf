# =============================================================================
# Reverse proxy — the single published entry point for the HIS sandbox.
#
# Serves the frontend at / and forwards /api/* to Kong. Nothing else in the
# sandbox publishes a port to the host except the databases and Kafka, which
# are exposed only to make testing observable.
# =============================================================================
worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;

    # Reuse the caller's correlation id when present so a browser-initiated
    # request keeps one id all the way to OpenELIS.
    map $http_x_correlation_id $correlation_id {
        ""      $request_id;
        default $http_x_correlation_id;
    }

    log_format sandbox escape=json
        '{"ts":"$time_iso8601","component":"edge-proxy","method":"$request_method",'
        '"path":"$uri","status":$status,"duration_ms":$request_time,'
        '"correlation_id":"$correlation_id","upstream":"$upstream_addr"}';

    access_log /dev/stdout sandbox;
    error_log  /dev/stderr warn;

    upstream kong_gateway { server kong:8000; }
    upstream his_frontend { server frontend:80; }

    server {
        listen 80 default_server;
        server_name _;

        location = /healthz {
            access_log off;
            add_header Content-Type application/json;
            return 200 '{"status":"ok","component":"edge-proxy"}';
        }

        # --- HIS sandbox APIs, via Kong -----------------------------------
        location /api/ {
            proxy_pass         http://kong_gateway/;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Correlation-ID $correlation_id;
            proxy_read_timeout 60s;
        }

        # --- Minimal test frontend ----------------------------------------
        location / {
            proxy_pass       http://his_frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Correlation-ID $correlation_id;
        }
    }
}
