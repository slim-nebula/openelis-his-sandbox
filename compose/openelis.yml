# =============================================================================
# OpenELIS Global 2 — deployed as an independent LIS
#
# Differences from the upstream compose file, both required by the brief:
#   1. No database service. The webapp and FHIR server point at
#      openelis-db.external on the data network via externalised datasource
#      properties supplied from .env.
#   2. The webapp additionally joins `integration`, a network shared with the
#      bridge and nothing else. OpenELIS has no route to Kafka, to Kong, or to
#      the HIS microservice, and no credentials for the HIS database.
# =============================================================================

services:

  # --- Self-signed keystore/truststore used for OpenELIS-internal TLS --------
  oe-certs:
    image: itechuw/certgen:main
    platform: linux/amd64
    container_name: openelis-certs
    restart: "no"
    environment:
      - KEYSTORE_PW="${SSL_KEYSTORE_PASSWORD}"
      - TRUSTSTORE_PW="${SSL_TRUSTSTORE_PASSWORD}"
    volumes:
      - oe-key-trust-store:/etc/openelis-global
      - oe-keys:/etc/ssl/private/
      - oe-certs:/etc/ssl/certs/
    networks: [openelis]

  # --- Export OpenELIS's certificate so the bridge can recognise it ----------
  # The bridge pins ONE certificate on its FHIR port, and that certificate is
  # OpenELIS's — so it has to be OpenELIS's real one, not something issued here.
  # It is read out of the store certgen wrote, which is why this cannot happen
  # before the stack starts and cannot be committed to the repository.
  #
  # It runs against the VOLUME rather than the running webapp, so it does not
  # wait for Tomcat: the store is complete the moment certgen exits. That is
  # what lets the bridge depend on this and start already able to complete a
  # handshake, instead of refusing OpenELIS's first few polls.
  #
  # Only the public certificate leaves the store. The bridge can recognise
  # OpenELIS; it holds nothing that would let it be OpenELIS.
  oe-peer-cert:
    image: itechuw/openelis-global-2:develop
    platform: linux/amd64
    container_name: openelis-peer-cert
    restart: "no"
    depends_on:
      oe-certs:
        condition: service_completed_successfully
    volumes:
      - oe-key-trust-store:/etc/openelis-global:ro
      # Writable, unlike everywhere else this directory is mounted: this is the
      # one place the exported certificate comes from.
      - ../certs:/certs
    environment:
      TRUSTSTORE_PW: ${SSL_TRUSTSTORE_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Via a temporary file. Writing straight to the destination would mean a
        # failed export replaces a good certificate with an empty one, and the
        # bridge would then refuse every handshake OpenELIS made.
        keytool -exportcert -rfc -alias oecert \
          -keystore /etc/openelis-global/truststore \
          -storepass "$$TRUSTSTORE_PW" -storetype PKCS12 > /tmp/oe.crt
        if [ ! -s /tmp/oe.crt ]; then
          echo "!! Exported nothing for alias oecert. Leaving /certs alone." >&2
          exit 1
        fi
        if cmp -s /tmp/oe.crt /certs/openelis-client.crt 2>/dev/null; then
          echo "OpenELIS's certificate is unchanged."
        else
          cp /tmp/oe.crt /certs/openelis-client.crt
          chmod 644 /certs/openelis-client.crt
          echo "Exported OpenELIS's certificate for the bridge to pin:"
          keytool -printcert -file /certs/openelis-client.crt | grep -E 'Owner|SHA1|SHA-1'
        fi
    networks: [openelis]

  # --- Teach OpenELIS to trust the bridge ------------------------------------
  # One keytool import, additive: our CA is added beside certgen's own entry,
  # which stays untouched. Runs on every `make up` because certgen may recreate
  # the store, and an import that happened once is not a guarantee.
  #
  # This is the ONLY change made to anything OpenELIS reads, and it is the
  # change its own installation guide describes: "build a truststore containing
  # the peer's certificate". No image, no code, no database.
  oe-trust-bridge:
    # The OpenELIS image itself, not a JRE image. Two reasons: it is already
    # pulled, so this adds nothing to a deployment; and its keytool is the same
    # one whose Tomcat will read the store, so a PKCS12 written here is one that
    # side can certainly open.
    image: itechuw/openelis-global-2:develop
    platform: linux/amd64
    container_name: openelis-trust-bridge
    restart: "no"
    depends_on:
      oe-certs:
        condition: service_completed_successfully
    volumes:
      - oe-key-trust-store:/etc/openelis-global
      - ../certs:/certs:ro
    environment:
      TRUSTSTORE_PW: ${SSL_TRUSTSTORE_PASSWORD}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        if [ ! -f /certs/ca.crt ]; then
          echo "No /certs/ca.crt — run 'make certs'. Leaving the truststore alone."
          exit 0
        fi
        # -noprompt overwrites the alias if it is already there, so re-running
        # after regenerating the CA picks up the new one rather than silently
        # keeping the old.
        keytool -delete -alias his-bridge-ca \
          -keystore /etc/openelis-global/truststore \
          -storepass "$$TRUSTSTORE_PW" -storetype PKCS12 2>/dev/null || true
        keytool -importcert -noprompt -alias his-bridge-ca \
          -file /certs/ca.crt \
          -keystore /etc/openelis-global/truststore \
          -storepass "$$TRUSTSTORE_PW" -storetype PKCS12
        echo "Imported the HIS bridge CA into OpenELIS's truststore:"
        keytool -list -keystore /etc/openelis-global/truststore \
          -storepass "$$TRUSTSTORE_PW" -storetype PKCS12 | grep -i "trustedCertEntry\|PrivateKey"
    networks: [openelis]

  # --- LIS application -------------------------------------------------------
  oe.openelis.org:
    image: itechuw/openelis-global-2:develop
    platform: linux/amd64
    container_name: openelis-webapp
    restart: unless-stopped
    depends_on:
      oe-certs:
        condition: service_completed_successfully
      # Must finish first: the truststore is read once, when Tomcat starts.
      oe-trust-bridge:
        condition: service_completed_successfully
    ports:
      - "${OE_HTTP_PORT}:8080"
      - "${OE_HTTPS_PORT}:8443"
    environment:
      - DEFAULT_PW=${OE_DEFAULT_PASSWORD}
      - TZ=${TZ}
      # context.xml cannot read environment variables, so the datasource is
      # passed as system properties. This is the entire "external database"
      # wiring — nothing about the DB is baked into the image.
      - >-
        CATALINA_OPTS=-Ddatasource.url=jdbc:postgresql://${OE_DB_HOST}:${OE_DB_PORT}/${OE_DB_NAME}
        -Ddatasource.username=${OE_DB_USER}
        -Ddatasource.password=${OE_DB_PASSWORD}
        -Doe.ssl.truststorepath=${SSL_TRUSTSTORE_PATH}
        -Doe.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD}
        -Doe.ssl.keystorepath=${SSL_KEYSTORE_PATH}
        -Doe.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}
    volumes:
      - oe-key-trust-store:/etc/openelis-global
      - ../openelis/volume/plugins/:/var/lib/openelis-global/plugins
      - oe-lucene:/var/lib/lucene_index
      - ../openelis/volume/analyzer/analyzer-test-map.csv:/var/lib/openelis-global/analyzer/analyzer-test-map.csv
      - ../openelis/volume/properties/SystemConfiguration.properties:/var/lib/openelis-global/properties/SystemConfiguration.properties
      - ../openelis/volume/odoo/odoo-test-product-mapping.csv:/var/lib/openelis-global/odoo/odoo-test-product-mapping.csv
      - ../openelis/volume/configuration:/var/lib/openelis-global/configuration
    secrets:
      - common.properties
    networks: [openelis, integration, data]

  # --- Co-resident HAPI FHIR store (OpenELIS's own working store) ------------
  fhir.openelis.org:
    image: itechuw/openelis-global-2-fhir:develop
    platform: linux/amd64
    container_name: openelis-fhir
    restart: unless-stopped
    depends_on:
      oe-certs:
        condition: service_completed_successfully
    ports:
      - "${OE_FHIR_HTTPS_PORT}:8443"
    environment:
      TZ: ${TZ}
      JAVA_OPTS: >-
        -Djavax.net.ssl.trustStore=${SSL_TRUSTSTORE_PATH}
        -Djavax.net.ssl.trustStorePassword=${SSL_TRUSTSTORE_PASSWORD}
        -Djavax.net.ssl.trustStoreType=pkcs12
        -Djavax.net.ssl.keyStore=${SSL_KEYSTORE_PATH}
        -Djavax.net.ssl.keyStorePassword=${SSL_KEYSTORE_PASSWORD}
        -Djavax.net.ssl.keyStoreType=pkcs12
      CATALINA_OPTS: >-
        -Dhapi.ssl.truststorepath=${SSL_TRUSTSTORE_PATH}
        -Dhapi.ssl.truststorepassword=${SSL_TRUSTSTORE_PASSWORD}
        -Dhapi.ssl.keystorepath=${SSL_KEYSTORE_PATH}
        -Dhapi.ssl.keystorepassword=${SSL_KEYSTORE_PASSWORD}
      FHIR_DATASOURCE_URL: "jdbc:postgresql://${OE_DB_HOST}:${OE_DB_PORT}/${OE_DB_NAME}?currentSchema=clinlims"
      FHIR_DATASOURCE_USERNAME: ${OE_DB_USER}
      FHIR_DATASOURCE_PASSWORD: ${OE_DB_PASSWORD}
      FHIR_SERVER_ADRESS: "http://fhir.openelis.org:8080/fhir/"
    volumes:
      - oe-key-trust-store:/etc/openelis-global
    networks: [openelis, data]

  # --- OpenELIS lab-user UI --------------------------------------------------
  frontend.openelis.org:
    image: itechuw/openelis-global-2-frontend:develop
    platform: linux/amd64
    container_name: openelis-frontend
    restart: unless-stopped
    environment:
      - CHOKIDAR_USEPOLLING=true
    tty: true
    networks: [openelis]

  # --- OpenELIS's own edge proxy (separate from the HIS sandbox edge) --------
  oe-proxy:
    image: itechuw/openelis-global-2-proxy:develop
    platform: linux/amd64
    container_name: openelis-proxy
    restart: unless-stopped
    # nginx resolves its upstreams at startup, so both must exist first or the
    # proxy crash-loops until they do.
    depends_on:
      oe-certs:
        condition: service_completed_successfully
      oe.openelis.org:
        condition: service_started
      frontend.openelis.org:
        condition: service_started
    ports:
      - "${OE_UI_HTTP_PORT}:80"
      - "${OE_UI_HTTPS_PORT}:443"
    volumes:
      - oe-certs:/etc/nginx/certs/
      - oe-keys:/etc/nginx/keys/
      - ../openelis/volume/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
    networks: [openelis]

secrets:
  common.properties:
    file: ../openelis/generated/common.properties

volumes:
  oe-key-trust-store:
  oe-certs:
  oe-keys:
  oe-lucene:
