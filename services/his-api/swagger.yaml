openapi: 3.0.3
info:
  title: HIS API service
  version: 1.0.0
  description: >
    Patients and lab orders — the HIS side of the OpenELIS integration.
    Client-facing routes are reached through Kong at /api; /internal/* is
    bridge-facing and deliberately not routed by the gateway.
paths:
  /health:
    get:
      summary: Liveness and database reachability
      responses:
        '200': { description: Healthy }
        '503': { description: Database unreachable }
  /patients:
    post:
      summary: Register a patient
      responses:
        '201': { description: Created }
        '400': { description: Invalid payload }
  /patients/search:
    get:
      summary: Search patients by name, MRN or national id
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 25, maximum: 200 } }
      responses:
        '200': { description: Matches }
  /lab-orders:
    post:
      summary: Place a lab order
      description: >
        Commits the order, its audit row and the lab.order.created event in one
        transaction. Nothing is published to Kafka on this path; the outbox
        relay does that, so a broker outage cannot fail an order.
      responses:
        '201': { description: Created }
        '400': { description: Unknown patient or inactive test code }
  /test-catalogue:
    get:
      summary: The orderable test menu, mirrored from OpenELIS
      responses:
        '200': { description: Active tests }
  /admin/catalogue/refresh:
    post:
      summary: Pull the menu the bridge discovered in OpenELIS
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Applied }
        '401': { description: Missing or invalid token }
        '409': { description: Refused — the bridge has no catalogue yet }
        '503': { description: HIS_ADMIN_TOKEN is not configured }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
